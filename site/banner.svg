<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">pankhllm</title>
  <desc id="d">The LLM gateway that learns to skip the LLM. 0.2 ms decisions on a CPU, no LLM call, OpenAI-compatible, one Rust binary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#07090f"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.18" cy="0.2" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.85" cy="0.3" r="0.45"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx="0.55" cy="1.05" r="0.5"><stop offset="0" stop-color="#34d399" stop-opacity=".22"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <linearGradient id="skip" x1="0" x2="1"><stop offset="0" stop-color="#34d399"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <linearGradient id="path" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1f2839" stroke-width="1"/></pattern>
    <clipPath id="r"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity=".55"/>
    <rect width="1200" height="320" fill="url(#g1)"/>
    <rect width="1200" height="320" fill="url(#g2)"/>
    <rect width="1200" height="320" fill="url(#g3)"/>
    <!-- request flow: app -> pankhllm -> decided (fast) / LLM (slow) -->
    <g transform="translate(632,58)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e8edf6">
      <rect x="0" y="80" width="118" height="52" rx="12" fill="#111725" stroke="#1f2839"/>
      <text x="59" y="111" text-anchor="middle">your app</text>
      <rect x="168" y="66" width="150" height="80" rx="16" fill="#111725" stroke="url(#mark)" stroke-width="1.6"/>
      <text x="243" y="101" text-anchor="middle" font-weight="700" font-size="15">pankhllm</text>
      <text x="243" y="121" text-anchor="middle" fill="#8d99ae" font-size="11">learns every decision</text>
      <rect x="372" y="14" width="150" height="52" rx="12" fill="#0f1f1a" stroke="#1f5c47"/>
      <text x="447" y="36" text-anchor="middle" fill="#34d399" font-weight="700">decided</text>
      <text x="447" y="54" text-anchor="middle" fill="#8d99ae" font-size="11">0.2 ms · no LLM call</text>
      <rect x="372" y="146" width="150" height="52" rx="12" fill="#1f1a0f" stroke="#5c4a1f"/>
      <text x="447" y="168" text-anchor="middle" fill="#fbbf24" font-weight="700">your LLM</text>
      <text x="447" y="186" text-anchor="middle" fill="#8d99ae" font-size="11">seconds · teaches it</text>
      <path d="M118 106 H168" stroke="#334155" stroke-width="2"/>
      <path d="M318 106 C 345 106, 345 40, 372 40" stroke="#34d399" stroke-width="3" fill="none"/>
      <path d="M318 106 C 345 106, 345 172, 372 172" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
      <circle cx="143" cy="106" r="5" fill="#8b5cf6"/>
      <circle cx="350" cy="62" r="5" fill="#34d399"/>
      <circle cx="362" cy="44" r="4" fill="#34d399" opacity=".7"/>
      <circle cx="338" cy="92" r="4" fill="#34d399" opacity=".5"/>
    </g>
    <!-- mark + wordmark -->
    <rect x="56" y="58" width="44" height="44" rx="13" fill="url(#mark)"/>
    <text x="114" y="92" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#e8edf6" letter-spacing="-0.5">pankhllm</text>
    <!-- headline -->
    <text x="56" y="170" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#e8edf6" letter-spacing="-1.5">The LLM gateway that</text>
    <text x="56" y="222" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#e8edf6" letter-spacing="-1.5">learns to <tspan fill="url(#skip)">skip the LLM</tspan>.</text>
    <!-- chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">
      <rect x="56" y="252" width="176" height="30" rx="15" fill="#111725" stroke="#1f2839"/><text x="144" y="272" text-anchor="middle"><tspan fill="#34d399">0.2 ms</tspan> per decision</text>
      <rect x="244" y="252" width="150" height="30" rx="15" fill="#111725" stroke="#1f2839"/><text x="319" y="272" text-anchor="middle"><tspan fill="#34d399">262 KB</tspan> of models</text>
      <rect x="406" y="252" width="118" height="30" rx="15" fill="#111725" stroke="#1f2839"/><text x="465" y="272" text-anchor="middle">no GPU</text>
      <rect x="536" y="252" width="176" height="30" rx="15" fill="#111725" stroke="#1f2839"/><text x="624" y="272" text-anchor="middle">OpenAI-compatible</text>
      <rect x="724" y="252" width="150" height="30" rx="15" fill="#111725" stroke="#1f2839"/><text x="799" y="272" text-anchor="middle">one Rust binary</text>
    </g>
  </g>
</svg>
