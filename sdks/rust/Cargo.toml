[package]
name = "pankhllm-client"
version = "0.1.0"
edition = "2021"
description = "Client for pankhllm, the LLM gateway that learns to skip the LLM."
repository = "https://github.com/singhpratech/pankhllm"
readme = "README.md"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt"] }
