[project]
name = "pankhllm"
version = "0.1.1"
description = "Client for pankhllm, the LLM gateway that learns to skip the LLM."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["llm", "gateway", "router", "openai", "agents"]
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://singhpratech.github.io/pankhllm/"
Repository = "https://github.com/singhpratech/pankhllm"
Documentation = "https://github.com/singhpratech/pankhllm/blob/main/docs/TRAINING.md"
